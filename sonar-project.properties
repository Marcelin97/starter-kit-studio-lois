# Nom du projet (doit correspondre � SonarCloud)
sonar.projectKey=Marcelin97_champagne-crm
sonar.organization=studio-lois
sonar.projectName=champagne-crm

# Chemins des fichiers � analyser
sonar.sources=src,app,pages,components,lib
sonar.tests=__tests__,tests

# Fichiers de couverture de test (générés par Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions (fichiers/dossiers à ignorer)
sonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/coverage/**,.next/**,out/**,build/**,dist/**,public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/__tests__/**,**/tests/**
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Encodage des fichiers
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.node.maxspace=4096