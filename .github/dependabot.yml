# Configuration Dependabot simple pour le projet
version: 2

updates:
  # GitHub Actions - Vérification hebdomadaire
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependabot"
      - "github-actions"

  # npm/pnpm - Dépendances JavaScript
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Séparer les mises à jour de sécurité des mises à jour régulières via des labels
    labels:
      - "dependabot"
      - "javascript"

    # Grouper les petites mises à jour pour éviter d'être submergé
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker - Images Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependabot"
      - "docker"
