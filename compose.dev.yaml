services:
  next-app:
    container_name: champagne-crm-dev
    build:
      context: ./
      dockerfile: dev.Dockerfile

    # Set environment variables directly in the compose file
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/champagne_crm_dev
      # ⭐ Force le mode dev avec Hot Reload
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: "true"
      # ⭐ Pour Turbopack (si vous l'utilisez)
      TURBOPACK: "true"
      NEXT_PUBLIC_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-key-change-me-in-production

    # Set environment variables based on the .env file
    env_file:
      - .env.development
    volumes:
      # Source code
      - ./app:/app/app # ✅ Lien dynamique vers votre code local
      - ./components:/app/components
      - ./lib:/app/lib
      - ./hooks:/app/hooks
      - ./types:/app/types
      - ./public:/app/public

      # Config files
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml

      # Prisma
      - ./prisma:/app/prisma # ⭐ Ajoutez ceci

      # ⭐ IMPORTANT : Exclure node_modules pour éviter les conflits
      - next_node_modules:/app/node_modules
      - next_cache:/app/.next
    restart: always
    ports:
      - 3000:3000
    networks:
      - champagne-network
    depends_on:
      postgres:
        condition: service_healthy

  # Add more containers below (nginx, postgres, etc.)
  postgres:
    container_name: champagne-postgres-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: champagne_crm_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - champagne-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  next_node_modules:
  next_cache:

# Define a network, which allows containers to communicate
# with each other, by using their container name as a hostname
networks:
  champagne-network:
    driver: bridge
